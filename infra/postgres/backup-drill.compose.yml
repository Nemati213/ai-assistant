services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.10-alpine3.23}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
      TG_DB_USERNAME: ${TG_DB_USERNAME}
      TG_DB_PASSWORD: ${TG_DB_PASSWORD}
      VK_DB_USERNAME: ${VK_DB_USERNAME}
      VK_DB_PASSWORD: ${VK_DB_PASSWORD}
      ORCHESTRATOR_DB_USERNAME: ${ORCHESTRATOR_DB_USERNAME}
      ORCHESTRATOR_DB_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD}
      AI_DB_USERNAME: ${AI_DB_USERNAME}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true
