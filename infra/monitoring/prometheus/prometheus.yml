global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - tg-connector-service:8084
        labels:
          application: tg-connector-service
      - targets:
          - vk-connector-service:8081
        labels:
          application: vk-connector-service
      - targets:
          - orchestrator-service:8082
        labels:
          application: orchestrator-service
      - targets:
          - ai-service:8083
        labels:
          application: ai-service
