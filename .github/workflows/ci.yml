name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Gradle tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit and integration tests
        run: ./gradlew test integrationTest --no-daemon

  production-config:
    name: Production config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose production file
        run: docker compose --env-file .env.prod.example -f compose.prod.yml config --quiet

      - name: Validate isolated staging Compose file
        run: docker compose -f compose.staging.yml config --quiet

      - name: Validate provider stub mappings
        run: jq empty infra/staging/wiremock/mappings/*.json

      - name: Validate Prometheus configuration
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          -v "$PWD/infra/monitoring/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.13.1
          check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager configuration
        run: |
          mkdir -p .secrets/alertmanager
          printf '%s' 'replace_me' > .secrets/alertmanager/telegram_bot_token
          printf '%s' '-1001234567890' > .secrets/alertmanager/telegram_chat_id
          docker compose \
            --env-file .env.prod.example \
            -f compose.prod.yml \
            run --rm --no-deps \
            --entrypoint /bin/amtool \
            alertmanager \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Grafana dashboard JSON
        run: jq empty infra/monitoring/grafana/dashboards/production-overview.json

      - name: Validate k6 load scenario
        run: >-
          docker run --rm
          -v "$PWD/load-tests:/scripts:ro"
          grafana/k6:2.0.0
          inspect /scripts/vk-webhook.js

      - name: Validate production shell scripts
        run: >-
          sh -n
          scripts/preflight-prod.sh
          scripts/secret-scan.sh
          scripts/test-alertmanager.sh
          scripts/backup-postgres.sh
          scripts/restore-postgres.sh
          scripts/drill-postgres-restore.sh
          scripts/test-postgres-backup-restore.sh
          scripts/run-load-test.sh
          scripts/staging-up.sh
          scripts/staging-down.sh
          scripts/run-staging-load-ladder.sh
          scripts/lib/postgres-backup-common.sh

      - name: Analyze production shell scripts
        run: >-
          docker run --rm
          --workdir /mnt
          -v "$PWD:/mnt:ro"
          koalaman/shellcheck:v0.11.0
          --exclude=SC1091,SC2016
          scripts/backup-postgres.sh
          scripts/restore-postgres.sh
          scripts/drill-postgres-restore.sh
          scripts/test-postgres-backup-restore.sh
          scripts/run-load-test.sh
          scripts/staging-up.sh
          scripts/staging-down.sh
          scripts/run-staging-load-ladder.sh
          scripts/lib/postgres-backup-common.sh

      - name: Exercise PostgreSQL backup and restore
        run: sh scripts/test-postgres-backup-restore.sh

      - name: Scan tracked files for obvious secrets
        run: sh ./scripts/secret-scan.sh
