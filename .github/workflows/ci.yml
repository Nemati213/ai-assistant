name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Gradle tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit and integration tests
        run: ./gradlew test integrationTest --no-daemon

  production-config:
    name: Production config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose production file
        run: docker compose --env-file .env.prod.example -f compose.prod.yml config --quiet

      - name: Scan tracked files for obvious secrets
        run: sh ./scripts/secret-scan.sh
